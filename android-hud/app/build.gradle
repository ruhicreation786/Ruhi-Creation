plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruhi.hud'
    compileSdk 34

    defaultConfig {
        applicationId "com.ruhi.hud"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Single source of truth: the web HUD lives in ../hud-launcher
    sourceSets {
        main {
            assets.srcDirs = ['../../hud-launcher']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
