<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>RUHI HUD</title>
<style>
  :root{
    --bg:#050507; --red:#ff2a3d; --red-dim:#7a1220; --blue:#2b6fff; --ink:#ffd9dd;
    --glow:0 0 8px rgba(255,42,61,.8),0 0 22px rgba(255,42,61,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
  body{display:flex;justify-content:center}
  .screen{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    background:radial-gradient(120% 60% at 50% 25%,#1a0509 0%,#050507 70%)}
  .grid-bg{position:absolute;inset:0;opacity:.18;pointer-events:none;
    background-image:linear-gradient(var(--red-dim) 1px,transparent 1px),linear-gradient(90deg,var(--red-dim) 1px,transparent 1px);
    background-size:28px 28px;mask-image:radial-gradient(circle at 50% 30%,#000 10%,transparent 70%)}
  .scan{position:absolute;left:0;right:0;height:120px;top:-120px;pointer-events:none;
    background:linear-gradient(transparent,rgba(255,42,61,.08),transparent);animation:scan 6s linear infinite}
  @keyframes scan{to{transform:translateY(1100px)}}

  .status{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 0;
    font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--red);text-shadow:var(--glow);z-index:2}
  .status .pill{border:1px solid var(--red);padding:3px 8px;border-radius:3px}

  .ring-wrap{position:relative;z-index:1;margin:6px auto 0;width:min(86vw,340px);aspect-ratio:1}
  .ring-wrap svg{width:100%;height:100%;overflow:visible}
  .spin{transform-origin:200px 200px;animation:spin 40s linear infinite}
  .spin.rev{animation-duration:60s;animation-direction:reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .seg{cursor:pointer;transition:filter .15s}
  .seg path{fill:rgba(43,111,255,.18);stroke:var(--blue);stroke-width:1.2}
  .seg text{fill:#bcd2ff;font:700 9px ui-monospace,monospace;letter-spacing:.12em;text-anchor:middle}
  .seg:active path,.seg.on path{fill:rgba(255,42,61,.35);stroke:var(--red);filter:drop-shadow(0 0 6px var(--red))}
  .core{cursor:pointer}
  .core-pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:200px 200px}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
  .listening .core-pulse{animation-duration:.6s}

  .readout{position:absolute;left:50%;bottom:-9%;transform:translateX(-50%);text-align:center;font:600 10px ui-monospace,monospace;
    letter-spacing:.2em;color:var(--red);text-shadow:var(--glow);white-space:nowrap}
  .readout b{display:block;font-size:26px;letter-spacing:.08em;color:#fff;text-shadow:var(--glow);margin-bottom:2px}

  .brief{z-index:1;margin-top:8px;border-left:2px solid var(--red);padding:6px 10px;background:linear-gradient(90deg,rgba(255,42,61,.12),transparent)}
  .brief h2{font:800 18px/1.1 "Segoe UI",sans-serif;letter-spacing:.06em;color:var(--red);text-shadow:var(--glow)}
  .brief p{font:500 11px/1.4 ui-monospace,monospace;color:#e9b8be;margin-top:3px;min-height:15px}

  .graph{z-index:1;margin-top:8px;height:64px;border:1px solid var(--red-dim);border-radius:4px;position:relative;
    background:rgba(255,42,61,.04);overflow:hidden}
  .graph canvas{width:100%;height:100%;display:block}
  .graph span{position:absolute;top:4px;left:8px;font:600 9px ui-monospace,monospace;letter-spacing:.18em;color:var(--red)}

  .apps{z-index:1;margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .app{aspect-ratio:1.15;border:1px solid var(--red-dim);border-radius:4px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;background:rgba(255,42,61,.05);position:relative;cursor:pointer;transition:.15s}
  .app::before,.app::after{content:"";position:absolute;width:6px;height:6px;border:1px solid var(--red)}
  .app::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .app::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
  .app:active{background:rgba(255,42,61,.28);box-shadow:var(--glow)}
  .app svg{width:22px;height:22px;stroke:var(--red);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--red))}
  .app em{font:600 8.5px ui-monospace,monospace;font-style:normal;letter-spacing:.14em;color:#e9b8be}

  .spacer{flex:1}
  .dock{z-index:2;display:flex;justify-content:space-around;align-items:center;padding:10px 0 12px;
    border-top:1px solid var(--red-dim);font:700 10px ui-monospace,monospace;letter-spacing:.2em}
  .dock button{background:none;border:0;color:var(--red);font:inherit;text-shadow:var(--glow);padding:8px 10px;cursor:pointer}
  .dock .mic{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--red);box-shadow:var(--glow),inset 0 0 14px rgba(255,42,61,.4);
    display:grid;place-items:center;margin-top:-30px;background:#14060a;padding:0}
  .dock .mic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
  .dock .mic.hot{background:var(--red);animation:pulse 0.6s infinite}
  .toast{position:absolute;left:50%;top:46%;transform:translate(-50%,10px);opacity:0;z-index:5;pointer-events:none;
    background:rgba(5,5,7,.92);border:1px solid var(--red);padding:8px 14px;border-radius:3px;
    font:600 11px ui-monospace,monospace;letter-spacing:.14em;color:#fff;text-shadow:var(--glow);transition:.25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="grid-bg"></div><div class="scan"></div>

  <div class="status">
    <span class="pill">R.U.H.I OS</span>
    <span id="net">LINK OK</span>
    <span id="bat">BAT --%</span>
  </div>

  <div class="ring-wrap">
    <svg viewBox="0 0 400 400" id="ring">
      <defs>
        <radialGradient id="cg"><stop offset="0" stop-color="#ff7b88"/><stop offset=".6" stop-color="#ff2a3d"/><stop offset="1" stop-color="#4a0610"/></radialGradient>
      </defs>
      <g class="spin">
        <circle cx="200" cy="200" r="186" fill="none" stroke="#7a1220" stroke-width="1" stroke-dasharray="2 6"/>
        <circle cx="200" cy="200" r="176" fill="none" stroke="#ff2a3d" stroke-width="1.4" stroke-dasharray="60 14 6 14"/>
      </g>
      <g class="spin rev">
        <circle cx="200" cy="200" r="96" fill="none" stroke="#ff2a3d" stroke-width="1" stroke-dasharray="3 5" opacity=".7"/>
      </g>
      <g id="segs"></g>
      <g class="core" id="core">
        <circle class="core-pulse" cx="200" cy="200" r="52" fill="url(#cg)" opacity=".9"/>
        <circle cx="200" cy="200" r="62" fill="none" stroke="#ff2a3d" stroke-width="2" style="filter:drop-shadow(0 0 8px #ff2a3d)"/>
        <circle cx="200" cy="200" r="30" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="10 4" opacity=".8"/>
        <circle cx="200" cy="200" r="8" fill="#fff"/>
      </g>
    </svg>
    <div class="readout"><b id="clock">--:--</b><span id="date">---</span></div>
  </div>

  <div class="brief">
    <h2 id="greet">GOOD NIGHT</h2>
    <p id="line">Hold the core to talk. Tap a sector to launch.</p>
  </div>

  <div class="graph"><span>SYS LOAD</span><canvas id="wave"></canvas></div>

  <div class="apps" id="apps"></div>

  <div class="spacer"></div>

  <div class="dock">
    <button data-act="PHONE">PHONE</button>
    <button data-act="MSG">MSG</button>
    <button class="mic" id="mic" aria-label="Hold to talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button data-act="CAMERA">CAMERA</button>
    <button data-act="APPS">APPS</button>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const cx = 200, cy = 200;

  // ---- radial menu (7 sectors across the top arc) ----
  const sectors = ["CONTROL","FOCUS","TASKS","AGENTS","SCENES","MEDIA","VAULT"];
  const rIn = 104, rOut = 150, a0 = -200, a1 = 20, gap = 2.5;
  const pt = (r, deg) => { const t = deg * Math.PI / 180; return [cx + r * Math.cos(t), cy + r * Math.sin(t)]; };
  const step = (a1 - a0) / sectors.length;
  const segs = $("#segs");
  sectors.forEach((name, i) => {
    const s = a0 + i * step + gap, e = a0 + (i + 1) * step - gap;
    const [x1,y1] = pt(rOut,s), [x2,y2] = pt(rOut,e), [x3,y3] = pt(rIn,e), [x4,y4] = pt(rIn,s);
    const g = document.createElementNS(NS, "g"); g.setAttribute("class", "seg");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", `M${x1},${y1} A${rOut},${rOut} 0 0 1 ${x2},${y2} L${x3},${y3} A${rIn},${rIn} 0 0 0 ${x4},${y4}Z`);
    const [tx,ty] = pt((rIn + rOut) / 2 + 3, (s + e) / 2);
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", tx); t.setAttribute("y", ty); t.textContent = name;
    t.setAttribute("transform", `rotate(${(s + e) / 2 + 90} ${tx} ${ty})`);
    g.append(p, t);
    g.addEventListener("click", () => {
      document.querySelectorAll(".seg").forEach(n => n.classList.remove("on"));
      g.classList.add("on"); toast(name + " ONLINE"); say(name + " module engaged.");
    });
    segs.appendChild(g);
  });

  // ---- app tiles ----
  const icons = {
    MAIL:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
    MAPS:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    MUSIC:'<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/>',
    WEB:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
    NOTES:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    CAL:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    CHAT:'<path d="M4 5h16v11H9l-5 4z"/>',
    SETTINGS:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
  };
  Object.entries(icons).forEach(([k, d]) => {
    const b = document.createElement("div"); b.className = "app";
    b.innerHTML = `<svg viewBox="0 0 24 24">${d}</svg><em>${k}</em>`;
    b.onclick = () => { toast("LAUNCH " + k); say("Opening " + k.toLowerCase() + "."); };
    $("#apps").appendChild(b);
  });
  document.querySelectorAll(".dock [data-act]").forEach(b => b.onclick = () => toast("LAUNCH " + b.dataset.act));

  // ---- helpers ----
  const toastEl = $("#toast"); let tt;
  function toast(m){ toastEl.textContent = m; toastEl.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("show"), 1100); }
  let typing;
  function say(text){
    clearTimeout(typing); const el = $("#line"); el.textContent = ""; let i = 0;
    (function k(){ el.textContent = text.slice(0, ++i); if (i < text.length) typing = setTimeout(k, 18); })();
  }

  // ---- clock, greeting, battery ----
  function tick(){
    const d = new Date(), h = d.getHours();
    $("#clock").textContent = String(h).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
    $("#date").textContent = d.toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short"}).toUpperCase();
    $("#greet").textContent = h < 5 ? "GOOD NIGHT" : h < 12 ? "GOOD MORNING" : h < 17 ? "GOOD AFTERNOON" : h < 21 ? "GOOD EVENING" : "GOOD NIGHT";
    $("#net").textContent = navigator.onLine ? "LINK OK" : "OFFLINE";
  }
  tick(); setInterval(tick, 1000);
  if (navigator.getBattery) navigator.getBattery().then(b => {
    const u = () => $("#bat").textContent = "BAT " + Math.round(b.level * 100) + "%" + (b.charging ? "+" : "");
    u(); b.onlevelchange = b.onchargingchange = u;
  });

  // ---- live waveform ----
  const cv = $("#wave"), c = cv.getContext("2d"); let W, H, t = 0, amp = 1; const hist = [];
  function size(){ const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; W = cv.width = r.width * dpr; H = cv.height = r.height * dpr; }
  size(); addEventListener("resize", size);
  (function draw(){
    t += 0.06; const n = 120;
    hist.push(0.5 + 0.28 * amp * Math.sin(t) * Math.sin(t * 0.37) + (Math.random() - .5) * 0.18 * amp);
    if (hist.length > n) hist.shift();
    c.clearRect(0,0,W,H); c.lineWidth = 2 * (devicePixelRatio || 1); c.strokeStyle = "#ff2a3d"; c.shadowColor = "#ff2a3d"; c.shadowBlur = 10;
    c.beginPath(); hist.forEach((v,i) => { const x = i / (n - 1) * W, y = H * (1 - v); i ? c.lineTo(x,y) : c.moveTo(x,y); }); c.stroke();
    requestAnimationFrame(draw);
  })();

  // ---- hold to talk (Web Speech API where supported) ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  const mic = $("#mic"), core = $("#core");
  function reply(q){
    q = q.toLowerCase();
    if (/time/.test(q)) return "It is " + $("#clock").textContent + ".";
    if (/battery/.test(q)) return $("#bat").textContent.replace("BAT","Battery at") + ".";
    if (/hello|hi\b/.test(q)) return "Online and listening.";
    return "Heard: " + q;
  }
  function start(){
    $("#screen").classList.add("listening"); mic.classList.add("hot"); amp = 3; say("Listening...");
    if (!SR) { setTimeout(() => say("Speech input is not supported in this browser."), 700); return; }
    rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
    rec.onresult = e => say(reply(e.results[0][0].transcript));
    rec.onerror = () => say("Mic unavailable.");
    try { rec.start(); } catch(_){}
  }
  function stop(){ $("#screen").classList.remove("listening"); mic.classList.remove("hot"); amp = 1; try { rec && rec.stop(); } catch(_){} }
  [mic, core].forEach(el => {
    el.addEventListener("pointerdown", e => { e.preventDefault(); start(); });
    ["pointerup","pointerleave","pointercancel"].forEach(ev => el.addEventListener(ev, stop));
  });
})();
</script>
</body>
</html>
