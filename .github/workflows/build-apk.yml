name: Build video downloader APK

on:
  push:
    paths:
      - "video-downloader-android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-downloader-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RuhiTek-Downloader.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RuhiTek-Downloader-apk
          path: video-downloader-android/RuhiTek-Downloader.apk

      - name: Publish APK as a download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="downloader-v1.0-build${{ github.run_number }}"
          gh release create "$TAG" RuhiTek-Downloader.apk \
            --target "${{ github.sha }}" \
            --title "RuhiTek Video Downloader (build ${{ github.run_number }})" \
            --notes "Android APK. Open this page on your phone, tap RuhiTek-Downloader.apk, then install." \
            --latest=false
